name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devtrack
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devtrack" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Verify migrations apply to PostgreSQL
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://devtrack:devtrack@localhost:5432/devtrack
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
